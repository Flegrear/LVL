org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=false
android.useAndroidX=true
kotlin.code.style=official
# Compile Kotlin inside Gradle's own process: no separate Kotlin daemon left holding memory.
kotlin.compiler.execution.strategy=in-process
# Keep Kotlin's per-project cache in the ignored build/ folder.
kotlin.project.persistent.dir=../build/android-gradle/.kotlin

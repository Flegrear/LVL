<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <meta name="robots" content="noindex, nofollow">
  <title>Page not found — LVL</title>
  <meta name="description" content="This LVL page could not be found. Return to the main page.">
  <link rel="icon" type="image/png" sizes="32x32" href="/LVL/assets/favicon.png">
  <link rel="stylesheet" href="/LVL/styles.css">
  <style>
    .error-page { min-height: 100svh; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: 32px; padding: 96px 0; }
    .error-page img { width: 92px; }
    .error-page h1 { max-width: 680px; color: #FFFFFF; }
    .error-page p { max-width: 480px; color: #A1A1A1; }
    .error-code { color: #999999; letter-spacing: .15em; }
    .error-page .primary-button { margin-top: 0; }
    @media (max-width: 640px) { .error-page h1 { font-size: 36px; line-height: 40px; } }
  </style>
</head>
<body>
  <a class="skip-link button-sm" href="#error-main">Skip to content</a>
  <main class="page-width error-page" id="error-main">
    <a href="/LVL/" aria-label="Return to LVL home"><img src="/LVL/assets/lvl-wordmark.svg" width="92" height="42" alt="LVL"></a>
    <span class="caption-3 error-code">404 / PAGE NOT FOUND</span>
    <h1 class="heading-1">This page wandered off.</h1>
    <p class="body-3">The page you requested is not here. Return to LVL to explore the app and download choices.</p>
    <a class="primary-button button-md" href="/LVL/">Back to LVL <span aria-hidden="true">↗</span></a>
  </main>
</body>
</html>

name: Build-only LVL Android native inputs

# Technical build inputs are immutable Actions artifacts, never GitHub Releases.
# Expiry affects future builds only; published APKs already embed their native tools.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-native-inputs
  cancel-in-progress: false

jobs:
  build-native-inputs:
    if: github.repository == 'Flegrear/LVL' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            abi: arm64-v8a
          - arch: x86_64
            abi: x86_64
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile one ABI using the reviewed Android NDK and source recipes
        shell: bash
        env:
          LVL_NATIVE_ARCH: ${{ matrix.arch }}
          LVL_NATIVE_ABI: ${{ matrix.abi }}
        run: |
          set -euo pipefail
          arch="$LVL_NATIVE_ARCH"
          abi="$LVL_NATIVE_ABI"
          case "$arch:$abi" in
            arm64:arm64-v8a|x86_64:x86_64) ;;
            *) echo 'Unsupported native architecture' >&2; exit 1 ;;
          esac
          docker build --tag lvl-android-native:ci android/native
          mkdir -p build/android-native
          volume="lvl-native-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${arch}"
          docker volume create "$volume" >/dev/null
          trap 'docker volume rm "$volume" >/dev/null' EXIT
          # Verify the container-to-runner ownership handoff before compiling.
          docker run --rm --volume "$PWD/build/android-native:/out" \
            lvl-android-native:ci bash -c 'mkdir -p /out/ownership-probe; touch /out/ownership-probe/container'
          docker run --rm --volume "$PWD/build/android-native:/out" \
            lvl-android-native:ci chown -R "$(id -u):$(id -g)" /out
          touch build/android-native/ownership-probe/runner
          rm -r build/android-native/ownership-probe
          for kind in node ffmpeg; do
            docker run --rm \
              --volume "$volume:/build" \
              --volume "$PWD/build/android-native:/out" \
              --volume "$PWD/android/native:/scripts:ro" \
              --env "JOBS=4" \
              lvl-android-native:ci bash "/scripts/build-$kind.sh" "$arch"
          done
          # Recipe outputs belong to root inside Docker. Return ownership before
          # the hosted runner creates the deployable FFmpeg directories.
          docker run --rm --volume "$PWD/build/android-native:/out" \
            lvl-android-native:ci chown -R "$(id -u):$(id -g)" /out
          mkdir -p "build/android-native/ffmpeg/$abi"
          for name in ffmpeg ffprobe BUILDINFO.txt LICENSE.ffmpeg.txt LICENSE.libwebp.txt; do
            cp "build/android-native/ffmpeg/candidates/$abi/$name" "build/android-native/ffmpeg/$abi/$name"
          done
      - name: Preserve exact ABI inputs for the combined verifier
        uses: actions/upload-artifact@v4
        with:
          name: lvl-android-native-abi-${{ matrix.abi }}
          path: |
            build/android-native/node/${{ matrix.abi }}/node
            build/android-native/node/${{ matrix.abi }}/BUILDINFO.txt
            build/android-native/node/${{ matrix.abi }}/LICENSE.node.txt
            build/android-native/ffmpeg/${{ matrix.abi }}/ffmpeg
            build/android-native/ffmpeg/${{ matrix.abi }}/ffprobe
            build/android-native/ffmpeg/${{ matrix.abi }}/BUILDINFO.txt
            build/android-native/ffmpeg/${{ matrix.abi }}/LICENSE.ffmpeg.txt
            build/android-native/ffmpeg/${{ matrix.abi }}/LICENSE.libwebp.txt
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: false

  package-native-inputs:
    needs: build-native-inputs
    if: github.repository == 'Flegrear/LVL' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install build manifest dependencies
        run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          pattern: lvl-android-native-abi-*
          path: build/android-native
          merge-multiple: true
      - name: Package exact source-pinned native inputs and verify extraction
        shell: bash
        run: |
          set -euo pipefail
          node android/tools/native-artifact.mjs pack \
            --native-dir build/android-native \
            --out-dir build/native-input-artifact \
            --source-sha "$GITHUB_SHA"
          sha="$(awk '$2 == "LVL-android-native.zip" { print $1 }' build/native-input-artifact/LVL-android-native.zip.sha256)"
          test "${#sha}" -eq 64
          node android/tools/native-artifact.mjs verify-bundle \
            --bundle-dir build/native-input-artifact \
            --sha "$sha" \
            --source-sha "$GITHUB_SHA" \
            --extract-dir build/native-verified
          node android/tools/release-check.mjs --native-dir build/native-verified
      - name: Upload immutable native build inputs (maximum 90-day retention)
        uses: actions/upload-artifact@v4
        with:
          name: lvl-android-native-inputs
          path: |
            build/native-input-artifact/LVL-android-native.zip
            build/native-input-artifact/LVL-android-native.zip.sha256
            build/native-input-artifact/LVL-android-native.build-manifest.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
          overwrite: false
